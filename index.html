<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Game</title>
</head>
<body>
    <div class="container">
        <h1>Rock Paper Scissors Game</h1>
        <p>Pick your move</p>
        <div class="scoreboard">
            <div class="score-box">
                <div class="label">You</div>
                <div class="value" id="player-score">0</div>
            </div>

            <div class="score-box">
                <div class="label">AI</div>
                <div class="value" id="AI-score">0</div>
            </div>
        </div>
        <div class="choices">
            <button class="move" data-move="Rock">Rock</button>
            <button class="move" data-move="Paper">Paper</button>
            <button class="move" data-move="Scissor">Scissor</button>
        </div>
        <div class="result" id="result">
            <p>Choose your move to start</p>
        </div>
        <div class="reset-box">
            <button class="reset-button" id="reset">Reset score</button>
        </div>
    </div>
</body>
</html>
